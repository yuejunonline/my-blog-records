name: 部署博客到 GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v3

      - name: 设置 Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: 缓存依赖项
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: 安全安装博客依赖
        run: |
          npm install

      - name: 编译生成静态网页
        run: |
          npx hexo clean
          npx hexo generate

      - name: 强制覆盖并发布到博客
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: public
          repository-name: yuejunonline/yuejunonline.github.io
          branch: master
          token: ${{ secrets.BLOG_TOKEN }}
          clean: true