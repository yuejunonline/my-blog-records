name: 部署博客到 GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装博客核心依赖
        run: npm install

      - name: 编译静态网页
        run: |
          ./node_modules/hexo/bin/hexo clean
          ./node_modules/hexo/bin/hexo generate

      - name: 配置 GitHub Pages 环境
        uses: actions/configure-pages@v4

      - name: 上传打包文件
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: 部署到 GitHub Pages 官方节点
        id: deployment
        uses: actions/deploy-pages@v4
